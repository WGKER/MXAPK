name: Build TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'decoded-apk/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  APKTOOL_VERSION: '3.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache apktool jar
        id: cache-apktool
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: apktool-${{ env.APKTOOL_VERSION }}

      - name: Download apktool
        if: steps.cache-apktool.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 2 -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          ls -lh apktool.jar
          java -jar apktool.jar --version

      - name: Preflight check
        run: |
          test -f decoded-apk/apktool.yml || { echo "::error::decoded-apk/apktool.yml 不存在，请确认目录结构"; exit 1; }
          test -d decoded-apk/smali || { echo "::error::decoded-apk/smali 不存在"; exit 1; }

          if grep -q "android.permission.RECEIVE_BOOT_COMPLETED" decoded-apk/AndroidManifest.xml; then
            echo "OK: 已声明 RECEIVE_BOOT_COMPLETED"
          else
            echo "::warning::AndroidManifest.xml 缺少 RECEIVE_BOOT_COMPLETED 权限，开机广播收不到，开机自启不会生效"
          fi

          if grep -q "BootReceiver" decoded-apk/AndroidManifest.xml; then
            echo "OK: 已声明 BootReceiver"
          else
            echo "::warning::AndroidManifest.xml 未声明 BootReceiver"
          fi

      - name: Build unsigned apk
        run: |
          mkdir -p out
          java -jar apktool.jar b decoded-apk -o out/unsigned.apk
          ls -lh out/unsigned.apk

      - name: Read version info
        run: |
          VER=$(grep -m1 versionName decoded-apk/apktool.yml | awk '{print $2}' | tr -d "'\"")
          CODE=$(grep -m1 versionCode decoded-apk/apktool.yml | awk '{print $2}')
          echo "APP_VER=${VER:-unknown}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
          echo "versionName=$VER versionCode=$CODE"

      - name: Zipalign
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -1d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f -p -v 4 out/unsigned.apk out/aligned.apk

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > sign.jks
            echo "KS_SRC=secret" >> "$GITHUB_ENV"
            echo "使用仓库 Secrets 中的签名证书"
          else
            keytool -genkeypair -v -keystore sign.jks -alias mxtv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=MXTV, OU=Dev, O=Mengxin, L=LYG, ST=JS, C=CN"
            echo "KS_SRC=generated" >> "$GITHUB_ENV"
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用临时生成的签名证书，覆盖安装会失败（需先卸载旧包）"
          fi

      - name: Sign apk
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          PASS="${KS_PASS:-android}"
          KPASS="${KEY_PASS:-$PASS}"
          ALIAS="${KS_ALIAS:-mxtv}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -1d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)

          "$BT/apksigner" sign \
            --ks sign.jks \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$KPASS" \
            --ks-key-alias "$ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "out/MXLauncher-${APP_VER}.apk" \
            out/aligned.apk

          echo "--- 签名校验 ---"
          "$BT/apksigner" verify --print-certs "out/MXLauncher-${APP_VER}.apk"
          ls -lh "out/MXLauncher-${APP_VER}.apk"

      - name: Package info
        run: |
          {
            echo "### 打包结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本名 | ${APP_VER} |"
            echo "| versionCode | ${APP_CODE} |"
            echo "| 签名来源 | ${KS_SRC} |"
            echo "| 产物 | MXLauncher-${APP_VER}.apk |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXLauncher-${{ env.APP_VER }}-${{ github.run_number }}
          path: out/MXLauncher-${{ env.APP_VER }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}-${{ github.run_number }}-${{ github.run_attempt }}
          name: MXLauncher ${{ env.APP_VER }} (#${{ github.run_number }})
          body: |
            versionName: ${{ env.APP_VER }}
            versionCode: ${{ env.APP_CODE }}
            签名来源: ${{ env.KS_SRC }}
          files: out/MXLauncher-${{ env.APP_VER }}.apk
