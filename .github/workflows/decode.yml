name: Apktool Decode
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.apk'

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool v3.0.3
        run: |
          # jar包带版本号
          wget https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O apktool.jar
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          mv apktool.jar /usr/local/bin/

      - name: Run apktool decode
        run: |
          apktool d app.apk -o decoded-apk --force

      - name: Upload decoded smali
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk
          path: decoded-apk
